name: CI

on:
  pull_request:

  # The frontend gate. The backend lives in boilplate-server and runs its own
  # jobs there; this repository no longer builds or tests it.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run check:ai
      - run: npm run check:automation
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run build-storybook
      # The e2e suite was never wired into CI, and a router bug that left the
      # first page a user sees completely blank went unnoticed because of it:
      # every other gate was green throughout. Unit tests render components in
      # isolation and cannot see a navigation that never settles.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm audit --audit-level=moderate

  # The frontend's assumptions checked against the backend's published spec.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The spec is vendored in contracts/ now that the server is its own
      # repository. This checks the frontend against the spec this commit was
      # built for. Whether that copy is current is a separate question, and
      # `npm run contract:sync` is how it gets refreshed.
      - run: npx vitest run src/test/contract
