name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # The frontend gate. The backend lives in boilplate-server and runs its own
  # jobs there; this repository no longer builds or tests it.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A gate needs a browser. Installed before `release`, because the e2e gate
      # reports itself skipped without one and a skipped gate proves nothing.
      - run: npx playwright install --with-deps chromium

      # Every gate, from `scripts/release.ts`, which is the same list
      # `npm run release` runs locally. This used to be fourteen separate steps
      # here and a thirteen-command `&&` chain in package.json, and the two had
      # already drifted: `check:tokens`, `check:docs` and `check:generators` were
      # in the chain and not in this workflow, so the token gate and the
      # generator gate never ran on a pull request at all.
      #
      # The runner groups each gate's output for the log and prints a summary
      # naming every gate that failed, rather than stopping at the first one.
      - run: npm run release

      # Lighthouse stays its own step. Accessibility and best-practices are
      # asserted as errors; performance stays a warning because it is wall-clock
      # timing on a shared runner, and a gate that fails on runner noise is one
      # people learn to re-run rather than read.
      - run: npm run perf:lighthouse

  # The frontend's assumptions checked against the backend's published spec.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The spec is vendored in contracts/ now that the server is its own
      # repository. This checks the frontend against the spec this commit was
      # built for. Whether that copy is current is a separate question, and
      # `npm run contract:sync` is how it gets refreshed.
      - run: npx vitest run src/test/contract

  # The deployment artifact. A Vite proxy is a dev-server feature and does not
  # survive `vite build`, so until this existed the production story was a
  # static bundle whose every /api call would have 404'd -- and no gate would
  # have said so, because every gate runs against the dev server or jsdom.
  #
  # This builds the image and asserts the three things the deployment depends
  # on: the app is served, a deep link is a client route rather than a 404, and
  # /api reaches the upstream instead of falling through to index.html. The
  # last one is the one that matters: a 200 full of HTML is what a missing
  # proxy looks like, and it fails later at DTO validation rather than here.
  deploy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stand up a stub backend to proxy to
        run: |
          docker network create web
          docker run -d --name upstream --network web -p 9099:80 \
            -v "$PWD/.github/stub:/usr/share/nginx/html:ro" nginx:alpine

      - name: Build the image
        run: docker build -t react-boilerplate:ci .

      - name: Serve the app, a deep link, and the proxied API
        run: |
          # --security-opt no-new-privileges reproduces how Render starts a
          # container. Without it this job ran the image under strictly weaker
          # rules than production and passed while the deploy failed at exec:
          # the caddy binary carries a file capability, and no-new-privileges
          # turns execve() of such a file into EPERM.
          docker run -d --name site --network web -p 8080:8080 \
            --security-opt no-new-privileges:true \
            -e BACKEND_ORIGIN=http://upstream:80 react-boilerplate:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done

          echo "--- the app is served ---"
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root"' \
            || { echo "index.html is not being served"; docker logs site; exit 1; }

          echo "--- a deep link is a client route ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/examples/graph)
          [ "$code" = "200" ] || { echo "deep link returned $code"; exit 1; }

          echo "--- /api reaches the upstream, not the SPA fallback ---"
          body=$(curl -s http://127.0.0.1:8080/api/health/live)
          echo "$body"
          case "$body" in
            *stub-upstream*) echo "the proxy is wired" ;;
            *) echo "/api fell through to the SPA -- the proxy is not wired"; exit 1 ;;
          esac

          docker logs site
          docker rm -f site upstream
